[package]
name = "tee-controller"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal dependencies
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
tonic = { version = "0.11", features = ["transport"] }
prost = { workspace = true }
tee-interface = { path = "../interface", features = ["async"] }
aristo-client = { path = "../client", features = ["market-data"] }
wasmlanche = { path = "../../hyper/x/contracts/wasmlanche" }
async-trait = "0.1"
futures = { version = "0.3", features = ["std", "async-await"] }
futures-util = "0.3"
tempfile = "3.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
hex = "0.4.3"
parking_lot = "0.12.3"
reqwest = { version = "0.11", features = ["json"] }
axum = "0.6"
tower = "0.4"
sha2 = "0.10.7"
digest = "0.10.0"
base64 = "0.21.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmlanche = { path = "../../hyper/x/contracts/wasmlanche", features = ["std", "simulator", "bindings"] }

# CLI
clap = { workspace = true }
which = "4.0"

# Randomization
rand = "0.8"

# Serialization
borsh = { version = "1.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Crypto
sha2 = "0.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"
env_logger = "0.10.0"

# Concurrency and synchronization
tokio-stream = "0.1"
tokio-util = "0.7"

# Mock coordinator
axum = { version = "0.6", optional = true }

[features]
default = []
mock-coordinator = ["axum"]

[[bin]]
name = "tee-controller"
path = "src/bin/tee_controller.rs"

[[bin]]
name = "test-client"
path = "src/bin/test_client.rs"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread", "test-util"] }
simple_add = { path = "tests/contracts/simple_add" }
