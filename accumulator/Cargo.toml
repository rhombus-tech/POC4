[package]
name = "rsa_accumulator"
version = "0.1.0"
edition = "2021"

[dependencies]
# Existing dependencies
hex = "0.4.3"
wasmlanche = { version = "0.1.0", path = "../../wasmlanche" }
tee-interface = { version = "0.1.0", path = "../../tee-interface" }
borsh = { version = "0.9.3", features = ["derive"] }
num-bigint = "0.4.3"
num-traits = "0.2.15"
num-integer = "0.1.45"
sha2 = "0.10.6"
rand = "0.8.5"

# HTTP server for WebAssembly
tiny_http = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "rsa_accumulator"
path = "src/main.rs"

[profile.release]
lto = true
opt-level = 's'
strip = true
